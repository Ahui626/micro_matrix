# gateway：对外 HTTP 入口。用 NodePort 暴露（演示用；生产用 Ingress / LB）。
# 注意它只覆盖绑定地址 GATEWAY_HOST，MM_ORDER_ADDR 直接用 ConfigMap 里的
# 目标地址 order:50051 —— gateway 是纯调用方，不覆盖目标地址。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: micro-matrix
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: localhost:5000/micro-matrix:v1   # 本地私有仓库（Docker Desktop K8s 拉不到 docker build 的镜像）
          imagePullPolicy: Always   # 本地仓库：每次重启都拉最新，改代码重推后不用换 tag
          command: ["python", "-u", "services/gateway/main.py"]
          envFrom:
            - configMapRef:
                name: micro-matrix-config
          ports:
            - name: http
              containerPort: 8000
          # readiness：/healthz 真的检查了 Redis（见 gateway/http_api.py），
          # 所以它适合当 readiness —— 依赖没就绪就不接流量。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # liveness：只测进程还活着。用 tcpSocket 而不是 /healthz ——
          # liveness 不能检查下游依赖，否则 Redis 一抖全站 Pod 被重启
          # （见 docs/4-concepts.md §10）。
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: micro-matrix
spec:
  selector:
    app: gateway
  type: NodePort   # 演示用，把网关暴露到集群外
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      # 不指定 nodePort 则自动分配 30000-32767 之间的端口。
